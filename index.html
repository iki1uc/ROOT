h2.sub{font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:var(--dim);margin-top:10px}
h2.sub span{color:var(--gold)}
nav{position:sticky;top:0;z-index:20;background:rgba(2,6,10,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -18px;padding:0 18px;display:flex;gap:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{display:inline-flex;align-items:center;gap:8px;padding:12px 14px;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent}
nav a:hover{color:var(--green);border-bottom-color:var(--green)}
nav a .dot{width:4px;height:4px;background:var(--dim);display:inline-block}
nav a:hover .dot{background:var(--green)}
main{padding:24px 0 48px;display:grid;gap:28px}
.panel{border:1px solid var(--line);background:var(--panel);position:relative}
.panel-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--dim)}
.panel-h .id{color:var(--gold)}
.panel-b{padding:16px 14px}
pre{white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,0.45);border:1px solid var(--line);padding:14px 14px;font-size:13px;line-height:1.7;overflow-x:auto}
pre .gold{color:var(--gold)}
pre .dim{color:var(--dim)}
pre .arrow{color:var(--gold)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:780px){.grid-2{grid-template-columns:1fr}}
.stationen{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
@media(max-width:900px){.stationen{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.stationen{grid-template-columns:1fr}}
.st{ background:var(--bg);padding:14px 14px;display:flex;flex-direction:column;gap:8px;min-height:118px}
.st .k{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--dim)}
.st .v{font-size:15px;font-weight:700;color:var(--green)}
.st .d{font-size:11px;color:var(--dim);line-height:1.5}
.st .link{margin-top:auto;font-size:11px}
.mapping-flow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0 18px;font-size:12px;letter-spacing:0.06em}
.mapping-flow .node{border:1px solid var(--line);padding:8px 12px;background:rgba(0,0,0,0.4);color:var(--green)}
.mapping-flow .node.gold{border-color:var(--gold-line);color:var(--gold)}
.mapping-flow .arr{color:var(--gold);font-size:14px}
.viz{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:780px){.viz{grid-template-columns:1fr}}
.viz-card{border:1px solid var(--line);background:rgba(0,0,0,0.35);padding:14px}
.viz-card h4{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.viz-card h4 b{color:var(--gold)}
.matrix{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);gap:2px;background:rgba(0,255,65,0.06);border:1px solid var(--line);padding:4px}
.matrix i{display:block;background:rgba(0,255,65,0.09);border:1px solid rgba(0,255,65,0.12);font-style:normal}
.matrix i:nth-child(41){background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px var(--gold)}
.matrix i:hover{background:var(--green)}
.oct-wrap{display:grid;place-items:center;padding:10px}
.status-line{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:8px 0}
.status-line .badge{border:1px solid var(--gold);color:var(--gold);padding:4px 8px;font-size:11px;letter-spacing:0.12em}
.downloads{display:flex;flex-wrap:wrap;gap:10px;padding-top:6px}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--green);padding:9px 14px;font-family:inherit;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn:hover{background:var(--green);color:var(--bg);border-color:var(--green)}
.btn.gold:hover{background:var(--gold);color:var(--bg)}
footer{border-top:1px solid var(--gold-line);padding:18px 0 32px;display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;font-size:11px;color:var(--dim);letter-spacing:0.06em}
footer a{color:var(--dim)}
footer a:hover{color:var(--gold)}
.line-no{color:var(--dim);user-select:none;margin-right:12px}
</style>
</head>
